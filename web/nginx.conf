# Arazi yukseklik (DEM) kutucuklari icin disk onbellegi. Bu dosya nginx'in
# http{} blogu icine dahil edildigi icin proxy_cache_path burada tanimlanabilir.
# Turkiye z0-15 tamami ~3-4 GB tutar; yalniz bakilan bolgeler indirilir.
proxy_cache_path /var/cache/nginx/terrain levels=1:2 keys_zone=terrain:20m
                 max_size=6g inactive=180d use_temp_path=off;
# Uydu goruntusu onbellegi. Goruntu kutucuklari agirdir; yalniz bakilan
# bolgeler saklanir, 30 gun kullanilmayan kutucuk silinir.
proxy_cache_path /var/cache/nginx/satellite levels=1:2 keys_zone=satellite:20m
                 max_size=20g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker dahili DNS: "server" konteyneri yeniden baslayinca IP yenilensin
    resolver 127.0.0.11 valid=30s;

    # Backend API
    location /api/ {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO - gercek zamanli konum (WebSocket)
    location /socket.io/ {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Yuklenen dosyalar (profil bannerlari)
    location /uploads/ {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
        proxy_set_header Host $host;
    }

    # Self-hosted vektor harita tile sunucusu.
    # /tiles/ oneki rewrite ile soyulur. proxy_pass URI'siz oldugu icin nginx
    # degisen URI'yi yeniden kodlar: "Noto Sans Regular" gibi bosluklu font
    # yollari bozulmadan gider ($1'i dogrudan proxy_pass'e yazmak 400 verir,
    # glyph alamayan mobil MapLibre de haritayi hic cizmez).
    # tileserver-gl-light yalniz "Noto Sans Regular" sunar. Baska bir fontstack
    # (eski uygulama surumlerindeki Bold/Italic) 400 alir ve native MapLibre
    # o tile'i cizmez; her fontstack istegi Regular'a yonlendirilir.
    location /tiles/fonts/ {
        set $papermap_tiles papermap-tiles:8080;
        rewrite ^/tiles/fonts/[^/]+/(.*)$ "/fonts/Noto Sans Regular/$1" break;
        proxy_pass http://$papermap_tiles;
        proxy_set_header Host $host;
    }

    location /tiles/ {
        set $papermap_tiles papermap-tiles:8080;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://$papermap_tiles;
        proxy_set_header Host $host;
    }

    # Arazi yukseklik kutucuklari (3B arazi + kabartma golgesi).
    # Kaynak: AWS Open Data "Terrain Tiles" (Mapzen, terrarium PNG, z0-15).
    # Istekleri tarayici degil bu sunucu yapar ve sonucu diskte saklar:
    # kullanicinin baktigi konum ucuncu tarafa gitmez, ayni kutucuk bir daha
    # indirilmez. Yukseklik verisi degismedigi icin uzun sure onbellekte kalir.
    location ~ ^/terrain/(?<tz>1[0-5]|[0-9])/(?<tx>\d+)/(?<ty>\d+)\.png$ {
        set $papermap_dem elevation-tiles-prod.s3.amazonaws.com;
        rewrite ^ /terrarium/$tz/$tx/$ty.png break;
        proxy_pass https://$papermap_dem;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $papermap_dem;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache terrain;
        proxy_cache_key $uri;
        proxy_cache_valid 200 180d;
        proxy_cache_valid 403 404 1d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # Native (Capacitor) uygulamalar farkli origin'den ister
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location /terrain/ {
        return 404;
    }

    # Uydu goruntusu (harita stili "Uydu").
    # Kaynak: Esri World Imagery. Tarayici Esri'ye dogrudan baglanmaz; istekleri
    # bu sunucu yapar ve onbellege alir. Esri {z}/{y}/{x} sirasini kullanir.
    # Baska saglayiciya gecmek icin yalniz $papermap_sat ve rewrite satirini
    # degistirin (ornek MapTiler:
    #   set $papermap_sat api.maptiler.com;
    #   rewrite ^ /tiles/satellite-v2/$sz/$sx/$sy.jpg?key=ANAHTAR break;).
    location ~ ^/satellite/(?<sz>1[0-9]|[0-9])/(?<sx>\d+)/(?<sy>\d+)\.jpg$ {
        set $papermap_sat server.arcgisonline.com;
        rewrite ^ /ArcGIS/rest/services/World_Imagery/MapServer/tile/$sz/$sy/$sx break;
        proxy_pass https://$papermap_sat;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $papermap_sat;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache satellite;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 403 404 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location /satellite/ {
        return 404;
    }

    # Backend saglik kontrolu
    location = /health {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
