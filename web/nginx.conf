server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker dahili DNS: "server" konteyneri yeniden baslayinca IP yenilensin
    resolver 127.0.0.11 valid=30s;

    # Backend API
    location /api/ {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO - gercek zamanli konum (WebSocket)
    location /socket.io/ {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Yuklenen dosyalar (profil bannerlari)
    location /uploads/ {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
        proxy_set_header Host $host;
    }

    # Self-hosted vektor harita tile sunucusu
    location /tiles/ {
        rewrite ^/tiles/(.*)$ /$1 break;
        set $papermap_tiles papermap-tiles:8080;
        proxy_pass http://$papermap_tiles;
        proxy_set_header Host $host;
    }

    # Backend saglik kontrolu
    location = /health {
        set $papermap_backend server:4015;
        proxy_pass http://$papermap_backend;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
