services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - papermap_db:/var/lib/postgresql/data
    # Veritabani yalnizca compose aginda; host'a / disariya acilmaz.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-4015}
      UPLOADS_DIR: /app/uploads
    volumes:
      - papermap_uploads:/app/uploads
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_HOST_PORT:-4015}:4015"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - server
    networks:
      default:
        # Benzersiz alias: reverse proxy bu adla yonlendirir (servis adi
        # "web" yaygin oldugu icin baska projelerle cakismasin diye).
        aliases:
          - papermap-web
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-8080}:80"

volumes:
  papermap_db:
  papermap_uploads:

networks:
  # Sabit ag adi: Docker'da calisan bir reverse proxy bu aga
  # "external" olarak baglanip server:4015 / web:80 adreslerine erisebilir.
  default:
    name: papermap-net
