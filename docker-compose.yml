services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - papermap_db:/var/lib/postgresql/data
    # Veritabani yalnizca compose aginda; host'a / disariya acilmaz.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-4015}
      UPLOADS_DIR: /app/uploads
      FCM_SERVICE_ACCOUNT: /app/fcm/service-account.json
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
    volumes:
      - papermap_uploads:/app/uploads
      # FCM push icin: ./fcm/service-account.json koyun (yoksa push devre disi)
      - ./fcm:/app/fcm:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_HOST_PORT:-4015}:4015"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${PORT:-4015}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        # Benzersiz alias: reverse proxy bu adla yonlendirir (servis adi
        # "web" yaygin oldugu icin baska projelerle cakismasin diye).
        aliases:
          - papermap-web
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-8080}:80"

  # Self-hosted vektor harita tile sunucusu (Turkiye).
  # turkey.mbtiles "scripts/build-turkey-tiles.sh" ile uretilir.
  tiles:
    image: maptiler/tileserver-gl-light:latest
    restart: unless-stopped
    command: ["--file", "/data/turkey.mbtiles", "--port", "8080"]
    volumes:
      - ./tiles:/data
    networks:
      default:
        aliases:
          - papermap-tiles

volumes:
  papermap_db:
  papermap_uploads:

networks:
  # Sabit ag adi: Docker'da calisan bir reverse proxy bu aga
  # "external" olarak baglanip server:4015 / web:80 adreslerine erisebilir.
  default:
    name: papermap-net
