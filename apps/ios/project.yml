# XcodeGen spec for the native PaperMap iOS app: `xcodegen generate` creates PaperMap.xcodeproj.
name: PaperMap
options:
  bundleIdPrefix: com.paperaxis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.8.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
settings:
  base:
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 200
    SWIFT_VERSION: "5.0"
targets:
  PaperMap:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PaperMap
      - path: ../shared/map-style-light.json
        buildPhase: resources
      - path: ../shared/map-style-dark.json
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: SocketIO
        product: SocketIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperaxis.papermap
        PRODUCT_NAME: PaperMap
        INFOPLIST_FILE: PaperMap/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
