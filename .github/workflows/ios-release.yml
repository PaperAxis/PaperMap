name: iOS IPA (imzasız)

# IPA imzasiz uretilir — gercek bir iPhone'a kurmak icin AltStore / Sideloadly
# gibi bir araclatekrar imzalanmalidir. Apple Developer hesabi olunca bu
# workflow'a imzalama eklenip dogrudan kurulabilir IPA / TestFlight yapilabilir.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend adresi (boş: repo değişkeni VITE_API_URL ya da varsayılan)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend adresini belirle
        id: cfg
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          VAR_URL: ${{ vars.VITE_API_URL }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then URL="$VAR_URL"; fi
          if [ -z "$URL" ]; then URL='https://maps.paperaxis.com'; fi
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend: $URL"

      - name: Web bağımlılıkları
        working-directory: web
        run: npm ci

      - name: Web build (VITE_API_URL gömülür)
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.cfg.outputs.api_url }}
        run: npm run build

      - name: iOS projesini oluştur
        working-directory: web
        run: |
          npx cap add ios
          node scripts/patch-ios-plist.mjs

      - name: İmzasız IPA derle
        working-directory: web/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/papermap-unsigned.ipa" Payload
          echo "IPA: $(ls -lh "$GITHUB_WORKSPACE/papermap-unsigned.ipa")"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: PaperMap ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('#{0}', github.run_number) }}
          files: papermap-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            PaperMap iOS — **imzasız** IPA.

            Gerçek bir iPhone'a kurmak için imzalanması gerekir:
            - **AltStore** veya **Sideloadly** ile kendi (ücretsiz) Apple ID'nizle
              imzalayıp yükleyin — uygulama 7 günde bir yenilenmelidir.
            - Apple Developer hesabınız varsa bu workflow'a imzalama eklenip
              kalıcı / TestFlight dağıtımı yapılabilir.

            Backend: `${{ steps.cfg.outputs.api_url }}`
