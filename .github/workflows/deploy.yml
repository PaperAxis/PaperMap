name: Sunucuya Dağıt

# main'e her itmede kodu sunucudaki kalıcı klasöre (varsayılan /opt/PaperMap)
# kurar ve docker compose ile yeniden derler. Runner PaperMap sunucusunun
# kendisinde (self-hosted) çalışır.
#
# Repo değişkenleri (Settings → Secrets and variables → Actions → Variables):
#   RUNNER_LINUX  — runner etiketleri (JSON), varsayılan ["self-hosted","linux","x64"]
#   PAPERMAP_DIR  — kurulum klasörü; boşsa /opt/PaperMap ya da çalışan
#                   "papermap" compose projesinin klasörü kullanılır

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'branding/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: maps.paperaxis.com
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Betikleri ve compose dosyasını denetle
        run: |
          bash -n scripts/deploy.sh scripts/backup-db.sh scripts/restore-db.sh
          docker compose -f docker-compose.yml config --quiet --no-interpolate

      - name: Kurulum klasörünü bul
        id: dir
        env:
          VAR_DIR: ${{ vars.PAPERMAP_DIR }}
        run: |
          DIR="$VAR_DIR"
          if [ -z "$DIR" ] && [ -f /opt/PaperMap/.env ]; then DIR=/opt/PaperMap; fi
          if [ -z "$DIR" ]; then
            # Çalışan "papermap" compose projesinin klasörü (docker compose ls).
            DIR=$(docker compose ls -a --format json | node -e '
              const list = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              const p = list.find((x) => x.Name === "papermap");
              if (p) console.log(require("path").dirname(p.ConfigFiles.split(",")[0]));
            ')
          fi
          if [ -z "$DIR" ] || [ ! -f "$DIR/.env" ]; then
            echo "::error::PaperMap kurulumu bu runner'da bulunamadı ($(hostname)). Compose projeleri:"
            docker compose ls -a || true
            echo "Kurulum klasörünü repo değişkeni PAPERMAP_DIR ile verin ya da runner'ı PaperMap sunucusuna kurun."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Kurulum klasörü: $DIR"

      - name: Güncellemeden önce veritabanı yedeği
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          if [ -x scripts/backup-db.sh ] && docker compose ps --status running --services 2>/dev/null | grep -qx db; then
            ./scripts/backup-db.sh
          else
            echo "db çalışmıyor — yedek atlandı."
          fi

      - name: Kur, derle ve yeniden başlat
        run: ./scripts/deploy.sh "${{ steps.dir.outputs.dir }}"
