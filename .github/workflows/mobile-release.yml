name: Mobil Sürüm (APK + IPA)

# Tek workflow — Android APK ve iOS IPA paralel derlenir, tek Release'e yüklenir.
# Android APK ve iOS IPA GitHub'ın runner'larında derlenir; APK ayrıca PaperUpdates'e
# (updates.paperaxis.com/papermap-android/) yayınlanır; uygulama oradan güncellenir.
# Tetikleme:
#  - main'e itme (web/ ya da marka değiştiyse)
#  - Elle: Actions sekmesinden "Run workflow"
#  - Etiket: "v*" formatinda bir tag (or. v1.0.0)
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend adresi (boş: repo değişkeni VITE_API_URL ya da varsayılan)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'branding/**'
      - '.github/workflows/mobile-release.yml'
    tags:
      - 'v*'

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ----- Release'i önceden aç -----
  # Dosyalar artifact yerine doğrudan Release'e yüklenir (artifact kotasına takılmaz).
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Backend adresini belirle
        id: cfg
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          VAR_URL: ${{ vars.VITE_API_URL }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then URL="$VAR_URL"; fi
          if [ -z "$URL" ]; then URL='https://maps.paperaxis.com'; fi
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: PaperMap ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('#{0}', github.run_number) }}
          body: |
            PaperMap mobil sürüm.

            - Backend (gömülü): `${{ steps.cfg.outputs.api_url }}`
            - Uygulama kimliği: `com.paperaxis.papermap`

            **Android** — `papermap.apk`'yı indirip kurun (Ayarlar > bilinmeyen
            kaynaklara izin verin).

            **iOS (AltStore)** — AltStore/SideStore'da kaynak (source) ekleyin:
            `${{ github.server_url }}/${{ github.repository }}/releases/latest/download/altstore.json`
            PaperMap listede çıkar; tek dokunuşla kurulur ve yeni sürümlerde
            güncellenir. Alternatif olarak `papermap-unsigned.ipa`'yı indirip
            AltStore "My Apps > +" ile elle de kurabilirsiniz.

  # ----- Android APK -----
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Sürüm: versionCode workflow çalıştırma numarasıdır, hep artar.
      APP_VERSION: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    outputs:
      api_url: ${{ steps.cfg.outputs.api_url }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK 21 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3
        with:
          # Varsayılan "tools" paketi yeni cmdline-tools'ta yok; sdkmanager hata verir.
          packages: platform-tools

      - name: Gerekli SDK paketleri
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Backend adresini belirle
        id: cfg
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          VAR_URL: ${{ vars.VITE_API_URL }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then URL="$VAR_URL"; fi
          if [ -z "$URL" ]; then URL='https://maps.paperaxis.com'; fi
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "APK'ya gömülecek backend adresi: $URL"

      - name: Web bağımlılıkları
        working-directory: web
        run: npm ci

      - name: Web build (VITE_API_URL ve sürüm gömülür)
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.cfg.outputs.api_url }}
          VITE_APP_BUILD: ${{ env.VERSION_CODE }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
        run: npm run build

      - name: Android projesini oluştur
        working-directory: web
        run: |
          rm -rf android
          npx cap add android
          node scripts/patch-manifest.mjs
          node scripts/patch-version.mjs "$APP_VERSION" "$VERSION_CODE"

      - name: Uygulama ikonlarını üret (assets/ -> mipmap)
        working-directory: web
        run: |
          npx --yes --package @capacitor/assets@3 -- capacitor-assets generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#10131c'

      - name: Firebase push yapılandır (varsa)
        working-directory: web
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret yok — APK push devre dışı (APK yine derlenir)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json 2>/dev/null || true
          if node -e 'JSON.parse(require("fs").readFileSync("android/app/google-services.json","utf8"))' 2>/dev/null; then
            node scripts/patch-google-services.mjs
            echo "Firebase push yapılandırıldı."
          else
            echo "::warning::google-services.json geçersiz — GOOGLE_SERVICES_JSON_BASE64 secret'i base64 değil ya da bozuk. Push devre dışı, APK yine derlenir."
            rm -f android/app/google-services.json
          fi

      - name: Keystore hazırla
        working-directory: web/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "KS_PASS=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "Kalıcı keystore (GitHub Secrets) kullanılıyor."
          else
            GEN_PASS="papermap-$(date +%s)-$RANDOM"
            echo "::add-mask::$GEN_PASS"
            keytool -genkeypair -keystore release.jks -alias papermap \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$GEN_PASS" -keypass "$GEN_PASS" \
              -dname "CN=PaperMap, O=PaperAxis, C=TR"
            echo "KS_PASS=$GEN_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=papermap" >> "$GITHUB_ENV"
            echo "KEY_PASS=$GEN_PASS" >> "$GITHUB_ENV"
            echo "::warning::Keystore secrets bulunamadı; bu derleme için geçici keystore üretildi. Uygulamayı önceki kurulum üzerine güncelleyebilmek için kalıcı keystore secret'larını ekleyin (README'ye bakın)."
          fi

      - name: Release APK derle ve imzala
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}zipalign" -f -p 4 "$UNSIGNED" app-aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$GITHUB_WORKSPACE/papermap.apk" \
            app-aligned.apk
          "${BUILD_TOOLS}apksigner" verify --verbose "$GITHUB_WORKSPACE/papermap.apk"
          rm -f release.jks

      - name: PaperUpdates'e yayınla
        env:
          PAPERAXIS_PUBLISH_TOKEN: ${{ secrets.PAPERAXIS_PUBLISH_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PAPERAXIS_PUBLISH_TOKEN" ]; then
            echo "::warning::PAPERAXIS_PUBLISH_TOKEN secret yok — PaperUpdates yayını atlandı."
            exit 0
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            # Geçici anahtarla imzalı APK kurulu uygulamanın üstüne kurulamaz.
            echo "::warning::Kalıcı keystore yok — uygulama içi güncelleme kurulamayacağı için PaperUpdates yayını atlandı."
            exit 0
          fi
          OUT="$RUNNER_TEMP/paperupdates"
          rm -rf "$OUT" && mkdir -p "$OUT"
          PKG="PaperMap-$APP_VERSION.apk"
          cp "$GITHUB_WORKSPACE/papermap.apk" "$OUT/$PKG"
          MIN_SDK=$(sed -n 's/.*minSdkVersion *= *\([0-9]*\).*/\1/p' web/android/variables.gradle | head -1)
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const [dir, pkg, version, code, minSdk] = process.argv.slice(1);
            const buf = fs.readFileSync(`${dir}/${pkg}`);
            const rel = {
              name: "PaperMap",
              id: "com.paperaxis.papermap",
              version,
              versionCode: Number(code),
              package: pkg,
              sha256: crypto.createHash("sha256").update(buf).digest("hex"),
              size: buf.length,
              minSdk: Number(minSdk) || 23,
              date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
            };
            fs.writeFileSync(`${dir}/releases.android.json`, JSON.stringify(rel, null, 2) + "\n");
            console.log(rel);
          ' "$OUT" "$PKG" "$APP_VERSION" "$VERSION_CODE" "$MIN_SDK"
          curl -fsSL https://updates.paperaxis.com/paperaxis-upload.sh -o "$RUNNER_TEMP/paperaxis-upload.sh"
          bash "$RUNNER_TEMP/paperaxis-upload.sh" "$OUT" --version "$APP_VERSION"

      - name: APK'yı Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          files: papermap.apk
          fail_on_unmatched_files: true

  # ----- iOS IPA (imzasız) -----
  ios:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend adresini belirle
        id: cfg
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          VAR_URL: ${{ vars.VITE_API_URL }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then URL="$VAR_URL"; fi
          if [ -z "$URL" ]; then URL='https://maps.paperaxis.com'; fi
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Web bağımlılıkları
        working-directory: web
        run: npm ci

      - name: Web build (VITE_API_URL gömülür)
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.cfg.outputs.api_url }}
        run: npm run build

      - name: iOS projesini oluştur
        working-directory: web
        run: |
          npx cap add ios
          node scripts/patch-ios-plist.mjs

      - name: Uygulama ikonlarını üret (assets/ -> AppIcon)
        working-directory: web
        run: |
          npx --yes --package @capacitor/assets@3 -- capacitor-assets generate \
            --ios \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#10131c'

      - name: İmzasız IPA derle
        working-directory: web/ios/App
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/papermap-unsigned.ipa" Payload
          echo "IPA: $(ls -lh "$GITHUB_WORKSPACE/papermap-unsigned.ipa")"
          # AltStore kaynağı için uygulama ikonunu çıkar (en büyük AppIcon PNG'si)
          ICON=$(find App.app -name 'AppIcon*.png' -type f -exec ls -S {} + 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$GITHUB_WORKSPACE/icon.png"
            echo "İkon: $ICON"
          else
            echo "::warning::Uygulama ikonu bulunamadı — AltStore kaynağında ikon olmayacak."
          fi

      - name: AltStore kaynağı oluştur
        id: altstore
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IPA="$GITHUB_WORKSPACE/papermap-unsigned.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::warning::IPA bulunamadı — AltStore kaynağı atlanıyor."
            echo "made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIZE=$(wc -c < "$IPA" | tr -d " ")  # macOS: BSD stat, -c yok
          DATE=$(date -u +%Y-%m-%d)
          DL="$REPO_URL/releases/latest/download/papermap-unsigned.ipa"
          ICON="$REPO_URL/releases/latest/download/icon.png"
          cat > altstore.json <<EOF
          {
            "name": "PaperMap",
            "subtitle": "Aile ve arkadaşlarla konum paylaşımı",
            "identifier": "com.paperaxis.papermap.source",
            "iconURL": "$ICON",
            "website": "$REPO_URL",
            "apps": [
              {
                "name": "PaperMap",
                "bundleIdentifier": "com.paperaxis.papermap",
                "developerName": "PaperAxis",
                "subtitle": "Aile ve arkadaşlarla konum paylaşımı",
                "localizedDescription": "Aile ve arkadaşlarınızla karşılıklı konum paylaşımı, harita üzerinde canlı takip, geofence bildirimleri ve mesajlaşma.",
                "iconURL": "$ICON",
                "tintColor": "2563EB",
                "category": "lifestyle",
                "version": "$APP_VERSION",
                "versionDate": "$DATE",
                "versionDescription": "PaperMap #${{ github.run_number }}",
                "downloadURL": "$DL",
                "size": $SIZE,
                "versions": [
                  {
                    "version": "$APP_VERSION",
                    "date": "$DATE",
                    "localizedDescription": "PaperMap #${{ github.run_number }}",
                    "downloadURL": "$DL",
                    "size": $SIZE,
                    "minOSVersion": "13.0"
                  }
                ]
              }
            ]
          }
          EOF
          echo "made=true" >> "$GITHUB_OUTPUT"
          echo "AltStore kaynağı oluşturuldu ($SIZE bayt IPA)."
          cat altstore.json

      - name: IPA'yı Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          files: |
            papermap-unsigned.ipa
            icon.png
            altstore.json
          fail_on_unmatched_files: false
